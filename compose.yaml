services:
  clipboard-x-server:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:28787:28787"
    volumes:
      - ./server/config.yaml:/app/server/config.yaml
      - clipboard-x-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  clipboard-x-data:
