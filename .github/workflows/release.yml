name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CBX_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check release version
        run: bun scripts/release.ts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run openapi:check

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: macos-15-intel, target: macos-x64 }
          - { runner: macos-15, target: macos-arm64 }
          - { runner: windows-2025, target: windows-x64 }
          - { runner: windows-11-arm, target: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build native archive
        env:
          CBX_RELEASE_TARGET: ${{ matrix.target }}
        run: bun run package
      - name: Smoke test executable and SQLite migrations
        run: bun scripts/smoke-release.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify all six archives and write checksums
        shell: bash
        run: |
          set -euo pipefail
          targets=(linux_amd64 linux_arm64 macos_amd64 macos_arm64 windows_amd64 windows_arm64)
          shopt -s nullglob
          archives=(release/*.tar.gz)
          test "${#archives[@]}" -eq "${#targets[@]}"
          for target in "${targets[@]}"; do
            archive="release/clipboard-x-server_${GITHUB_REF_NAME#v}_${target}.tar.gz"
            test -s "$archive"
            tar -tzf "$archive" > /dev/null
          done
          (cd release && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS "${flags[@]}"

  publish-image:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tags
        id: image-tags
        shell: bash
        run: |
          {
            echo 'value<<EOF'
            echo "ghcr.io/guleoo/clipboard-x-server:${GITHUB_REF_NAME}"
            if [[ "$GITHUB_REF_NAME" != *-* ]]; then
              echo 'ghcr.io/guleoo/clipboard-x-server:latest'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.value }}
          labels: org.opencontainers.image.source=https://github.com/guleoo/clipboard-x-server
          cache-from: type=gha
          cache-to: type=gha,mode=max
