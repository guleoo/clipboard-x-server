app:
  host: 0.0.0.0
  port: 28787
  timezone: UTC
  data-dir: ./data/dev
web:
  root: ../web/dist
  # Leave empty for direct HTTP access; set the browser-facing origin for an HTTPS reverse proxy.
  public-origin: ""
  # Set true when the browser accesses the panel over HTTPS, including through a reverse proxy.
  cookie-secure: false
limits:
  max-object-bytes: 83886080
  max-item-bytes: 268435456
  max-preview-bytes: 1048576
lifetimes:
  key-overlap-millis: 300000
  materialization-ttl-millis: 600000
cleanup:
  enabled: true
  interval-millis: 3600000
  clipboard:
    max-items-per-device-per-channel: 1000
    max-age-millis: 2592000000
administrator:
  username: admin
  password: change-this-password
devices: []
channels: []
