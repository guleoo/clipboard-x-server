app:
  host: 0.0.0.0
  port: 28787
  timezone: UTC
  data-dir: ./data/dev
web:
  root: ../web/dist
  # Leave empty for direct HTTP access; set the browser-facing origin for an HTTPS reverse proxy.
  public-origin: ""
  # Set true when the browser accesses the panel over HTTPS, including through a reverse proxy.
  cookie-secure: false
limits: # Capacity limits in KB (1 KB = 1024 bytes).
  max-object: 81920
  max-item: 262144
  max-preview: 1024
lifetimes: # Durations in seconds.
  key-overlap: 300
  materialization-ttl: 600
cleanup: # Durations in seconds; item limits are counts.
  enabled: true
  interval: 3600
  clipboard:
    max-items-per-device-per-channel: 1000
    max-age: 2592000
administrator:
  username: admin
  password: change-this-password
devices: []
channels: []
