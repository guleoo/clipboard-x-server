# 复制为 config.yaml 后修改。此文件包含明文密码和设备 API Key，运行时权限会收紧为 0600。
version: 1
server:
  environment: development
  host: 127.0.0.1
  port: 8787
  webRoot: ./web/dist
  publicOrigin: http://127.0.0.1:8787
  cookieSecure: false
  shutdownTimeoutMillis: 30000
  timezone: UTC
storage:
  dataDirectory: ./data
  migrationsDirectory: ./server/drizzle
  busyTimeoutMillis: 5000
  wal: true
limits:
  maxObjectBytes: 83886080
  maxItemBytes: 268435456
  maxPreviewBytes: 1048576
lifetimes:
  sessionTtlSeconds: 604800
  keyOverlapSeconds: 300
  materializationTtlSeconds: 600
  objectGcGraceSeconds: 86400
security:
  passwordMemoryCost: 65536
  passwordTimeCost: 3
  sessionTokenBytes: 32
  rateLimit:
    maximum: 600
    windowMillis: 60000
logger:
  console:
    enabled: true
    level: info
    format: pretty
  file:
    enabled: true
    level: info
    format: json
    dir: logs
    filename: app-%DATE%.log
    maxFiles: 30d
    maxSize: 100m
    zippedArchive: true
content:
  supportedMimeTypes:
    - text/plain;charset=utf-8
    - text/html
    - image/png
    - image/jpeg
    - image/webp
    - image/gif
administrator:
  username: admin
  password: change-this-password
devices: []
channels: []
