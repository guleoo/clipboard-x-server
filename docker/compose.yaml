services:
  clipboard-x-server:
    image: ghcr.io/guleo/clipboard-x-server:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${CBX_PUBLISH_HOST:-127.0.0.1}:${CBX_PUBLISH_PORT:-28787}:${CBX_PORT:-28787}"
    environment:
      CBX_HOST: ${CBX_HOST:-0.0.0.0}
      CBX_PORT: ${CBX_PORT:-28787}
      CBX_ADMIN_USERNAME: ${CBX_ADMIN_USERNAME:-admin}
      CBX_ADMIN_PASSWORD: ${CBX_ADMIN_PASSWORD:?Set CBX_ADMIN_PASSWORD in .env}
      CBX_PUBLIC_ORIGIN: ${CBX_PUBLIC_ORIGIN:-http://127.0.0.1:28787}
      CBX_COOKIE_SECURE: ${CBX_COOKIE_SECURE:-false}
      CBX_TLS_CERT_FILE: ${CBX_TLS_CERT_FILE:-}
      CBX_TLS_KEY_FILE: ${CBX_TLS_KEY_FILE:-}
    volumes:
      - clipboard-x-config:/app/config
      - clipboard-x-data:/app/data
      - ${CBX_TLS_HOST_DIR:-./certs}:/app/tls:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  clipboard-x-config:
  clipboard-x-data:
