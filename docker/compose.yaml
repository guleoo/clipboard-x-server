services:
  clipboard-x-server:
    image: ghcr.io/guleo/clipboard-x-server:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:28787:28787"
    environment:
      CBX_ADMIN_PASSWORD: ${CBX_ADMIN_PASSWORD:?Set CBX_ADMIN_PASSWORD in .env}
      CBX_PUBLIC_ORIGIN: ${CBX_PUBLIC_ORIGIN:-http://127.0.0.1:28787}
    volumes:
      - clipboard-x-config:/app/config
      - clipboard-x-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  clipboard-x-config:
  clipboard-x-data:
