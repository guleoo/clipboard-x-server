# Container configuration. Environment placeholders are resolved at startup.
app:
  host: 0.0.0.0
  port: 28787
  timezone: UTC
  data-dir: ./data
  tls:
    cert-file: ${env:CBX_TLS_CERT_FILE}
    key-file: ${env:CBX_TLS_KEY_FILE}
web:
  root: ../web
  public-origin: ${env:CBX_PUBLIC_ORIGIN}
  cookie-secure: ${env:CBX_COOKIE_SECURE}
limits: # Capacity limits in KB (1 KB = 1024 bytes).
  max-object: 81920
  max-item: 262144
  max-preview: 1024
lifetimes: # Durations in seconds.
  key-overlap: 300
  materialization-ttl: 600
cleanup: # Durations in seconds; item limits are counts.
  enabled: true
  interval: 3600
  clipboard:
    max-items-per-device-per-channel: 1000
    max-age: 2592000
administrator:
  username: ${env:CBX_ADMIN_USERNAME}
  password: ${env:CBX_ADMIN_PASSWORD}
devices: []
channels: []
