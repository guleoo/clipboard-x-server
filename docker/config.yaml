# Container configuration. Environment placeholders are resolved at startup.
app:
  host: 0.0.0.0
  port: 28787
  timezone: UTC
  data-dir: ../data
  tls:
    cert-file: ${env:CBX_TLS_CERT_FILE}
    key-file: ${env:CBX_TLS_KEY_FILE}
web:
  root: ../web
  public-origin: ${env:CBX_PUBLIC_ORIGIN}
  cookie-secure: ${env:CBX_COOKIE_SECURE}
limits:
  max-object-bytes: 83886080
  max-item-bytes: 268435456
  max-preview-bytes: 1048576
lifetimes:
  key-overlap-millis: 300000
  materialization-ttl-millis: 600000
cleanup:
  enabled: true
  interval-millis: 3600000
  clipboard:
    max-items-per-device-per-channel: 1000
    max-age-millis: 2592000000
administrator:
  username: ${env:CBX_ADMIN_USERNAME}
  password: ${env:CBX_ADMIN_PASSWORD}
devices: []
channels: []
