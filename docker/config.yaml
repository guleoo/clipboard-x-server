# Container configuration. Environment placeholders are resolved at startup.
app:
  name: clipboard-x-server
  hostname: ${env:CBX_HOST}
  port: ${env:CBX_PORT}
  tls:
    cert-file: ${env:CBX_TLS_CERT_FILE}
    key-file: ${env:CBX_TLS_KEY_FILE}
  timezone: Asia/Shanghai
  api-prefix: /
  shutdown-timeout-millis: 30000
  route-surfaces:
    admin: /admin/api
    app: /api
database:
  name: clipboard-x
  url: ../data/clipboard-x.db
  busy-timeout-millis: 5000
  wal: true
  schema-path: ./src/db/schema.ts
  migrations-folder: ../server/drizzle
logger:
  console:
    enabled: true
    level: info
  file:
    enabled: true
    level: info
    dir: ../data/logs
    filename: app-%DATE%.log
    max-files: 30d
    max-size: 100m
    zipped-archive: true
storage:
  data-directory: ../data
  object-directory: ../data/objects
web:
  root: ../web/dist
  public-origin: ${env:CBX_PUBLIC_ORIGIN}
  cookie-secure: ${env:CBX_COOKIE_SECURE}
limits:
  max-object-bytes: 83886080
  max-item-bytes: 268435456
  max-preview-bytes: 1048576
lifetimes:
  key-overlap-millis: 300000
  materialization-ttl-millis: 600000
cleanup:
  enabled: false
  interval-millis: 3600000
  clipboard: {}
content:
  supported-mime-types:
    - text/plain;charset=utf-8
    - text/html
    - image/png
    - image/jpeg
    - image/webp
    - image/gif
http:
  json-body-limit-bytes: 262144
  rate-limit:
    limit: 600
    window-millis: 60000
security:
  jwt-algorithm: HS256
  token-prefix: Bearer
  access-token-ttl-millis: 900000
  password:
    memory-cost: 65536
    time-cost: 3
session:
  ttl-millis: 604800000
  touch-interval-millis: 300000
  token-bytes: 32
administrator:
  username: ${env:CBX_ADMIN_USERNAME}
  password: ${env:CBX_ADMIN_PASSWORD}
devices: []
channels: []
